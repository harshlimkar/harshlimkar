<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #F0883E; }
      
      @keyframes vecBeam {
        0%, 100% { stroke-dashoffset: 40; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes voxelFloatRX {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      
      .beam-flow { stroke-dasharray: 6 3; animation: vecBeam 2s linear infinite; }
      .voxel-floating { animation: voxelFloatRX 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="195" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">BAJAJ FINSERV HACKRX 6.0</text>
  </g>

  <!-- Title & Sub -->
  <text x="24" y="76" class="proj-title">HackRx Query Retrieval</text>
  <text x="24" y="98" class="proj-sub">LLM Contextual Query Retrieval &amp; Policy Clause Matching</text>

  <!-- High Contrast Bullet Points -->
  <g transform="translate(24, 122)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="9" class="proj-body">• Semantic search across massive insurance &amp; legal policies</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="9" class="proj-body">• Sub-clause isolation &amp; cross-encoder re-ranking pipelines</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="9" class="proj-body">• FastAPI backend integrated with FAISS dense vector index</text>
    </g>
  </g>

  <!-- Right Side: 3D Minecraft Voxel Vector Search Block -->
  <g>
    <!-- Voxel Platform Pedestal -->
    <g transform="translate(470, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-125" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating 3D Minecraft Voxel Vector Stack -->
    <g class="voxel-floating">
      <!-- Base Knowledge Voxel Block -->
      <g transform="translate(470, 142)">
        <polygon points="0,-28 36,-12 0,4 -36,-12" fill="#21262D" stroke="#FFFFFF" stroke-width="1.2" />
        <polygon points="-36,-12 0,4 0,32 -36,16" fill="#161B22" stroke="#D0D7DE" stroke-width="1.2" />
        <polygon points="36,-12 0,4 0,32 36,16" fill="#30363D" stroke="#FFFFFF" stroke-width="1.2" />
      </g>

      <!-- Highlighted Query Match Voxel Cube (Emerald Block) -->
      <g transform="translate(470, 106)">
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Pixel pattern on top -->
        <polygon points="0,-12 12,-6 0,0 -12,-6" fill="#2EA043" />
        <polygon points="-26,-8 0,4 0,22 -26,10" fill="#2EA043" stroke="#D0D7DE" stroke-width="1.2" />
        <polygon points="26,-8 0,4 0,22 26,10" fill="#1C6C2B" stroke="#FFFFFF" stroke-width="1.2" />
      </g>

      <!-- High-Precision Match Vector Laser Beam -->
      <g transform="translate(470, 106)">
        <line x1="0" y1="-20" x2="0" y2="-55" stroke="#F0883E" stroke-width="2" class="beam-flow" />
        <circle cx="0" cy="-55" r="4" fill="#F0883E" />
        <text x="10" y="-52" class="proj-mono" fill="#F0883E">MATCH 98.4%</text>
      </g>
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="32" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">FAISS</text>

    <rect x="73" y="0" width="75" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="110" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">LangChain</text>

    <rect x="156" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="188" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">FastAPI</text>

    <rect x="229" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="261" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Python</text>
  </g>

  <text x="470" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">VOXEL VECTOR SEARCH 3D</text>
</svg>
