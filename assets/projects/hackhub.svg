<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #3FB950; }
      
      @keyframes qrLaserSweep {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(38px); opacity: 1; }
      }
      @keyframes voxelBarGrow {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.3); }
      }
      @keyframes voxelFloatHH {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      
      .qr-beam { animation: qrLaserSweep 2.5s ease-in-out infinite; }
      .bar-anim-1 { transform-origin: bottom; animation: voxelBarGrow 3s ease-in-out infinite; }
      .bar-anim-2 { transform-origin: bottom; animation: voxelBarGrow 3.5s ease-in-out infinite 0.5s; }
      .bar-anim-3 { transform-origin: bottom; animation: voxelBarGrow 4s ease-in-out infinite 1s; }
      .voxel-floating { animation: voxelFloatHH 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="190" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">HACKATHON PLATFORM // PROD</text>
  </g>

  <!-- Title & Sub -->
  <text x="24" y="76" class="proj-title">HackHub</text>
  <text x="24" y="98" class="proj-sub">Centralized Innovation &amp; Hackathon Management Ecosystem</text>

  <!-- High Contrast Bullet Points -->
  <g transform="translate(24, 122)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="9" class="proj-body">• Sub-second cryptographic QR check-in &amp; admission</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="9" class="proj-body">• Automated participant team formation &amp; mentor routing</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="9" class="proj-body">• Real-time live attendance analytics &amp; project submissions</text>
    </g>
  </g>

  <!-- Right Side: 3D Minecraft Voxel QR Terminal & Telemetry Block -->
  <g>
    <!-- Voxel Floor Pedestal -->
    <g transform="translate(470, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-115" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating 3D Isometric Voxel Terminal -->
    <g class="voxel-floating">
      <!-- Main Isometric Terminal Block -->
      <g transform="translate(470, 130)">
        <!-- Top Face (Terminal Roof) -->
        <polygon points="0,-32 38,-14 0,4 -38,-14" fill="#21262D" stroke="#FFFFFF" stroke-width="1.2" />
        
        <!-- Left Face (QR Code Matrix Screen) -->
        <polygon points="-38,-14 0,4 0,42 -38,24" fill="#161B22" stroke="#D0D7DE" stroke-width="1.2" />
        
        <!-- Minecraft Pixel QR Simulation on Left Face -->
        <g transform="translate(-28, -2) skewY(26)">
          <rect x="0" y="0" width="6" height="6" fill="#3FB950" />
          <rect x="8" y="0" width="4" height="4" fill="#FFFFFF" />
          <rect x="14" y="0" width="6" height="6" fill="#3FB950" />
          <rect x="0" y="8" width="4" height="4" fill="#FFFFFF" />
          <rect x="6" y="8" width="6" height="6" fill="#F0883E" />
          <rect x="14" y="8" width="4" height="4" fill="#FFFFFF" />
          <rect x="0" y="14" width="6" height="6" fill="#3FB950" />
          <rect x="8" y="14" width="4" height="4" fill="#FFFFFF" />
          <rect x="14" y="14" width="6" height="6" fill="#3FB950" />
          
          <!-- Scanning Emerald Beam -->
          <line x1="-2" y1="0" x2="22" y2="0" stroke="#3FB950" stroke-width="2" class="qr-beam" />
        </g>

        <!-- Right Face (Telemetry Voxel Bar Gauges) -->
        <polygon points="38,-14 0,4 0,42 38,24" fill="#30363D" stroke="#FFFFFF" stroke-width="1.2" />
        <g transform="translate(10, 8) skewY(-26)">
          <!-- Voxel Vertical Bars -->
          <rect x="0" y="10" width="4" height="18" fill="#3FB950" class="bar-anim-1" />
          <rect x="6" y="4" width="4" height="24" fill="#F0883E" class="bar-anim-2" />
          <rect x="12" y="14" width="4" height="14" fill="#FFFFFF" class="bar-anim-3" />
          <rect x="18" y="0" width="4" height="28" fill="#3FB950" class="bar-anim-1" />
        </g>
      </g>

      <!-- Satellite Voxel Check-in Badge Indicator -->
      <g transform="translate(518, 86)">
        <polygon points="0,-12 14,-5 0,2 -14,-5" fill="#3FB950" stroke="#FFFFFF" stroke-width="1" />
        <polygon points="-14,-5 0,2 0,16 -14,9" fill="#2EA043" stroke="#484F58" stroke-width="1" />
        <polygon points="14,-5 0,2 0,16 14,9" fill="#1C6C2B" stroke="#FFFFFF" stroke-width="1" />
      </g>
      <text x="518" y="70" class="proj-mono" fill="#3FB950" text-anchor="middle">VERIFIED</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="70" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="35" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Next.js</text>

    <rect x="78" y="0" width="85" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="120" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">TypeScript</text>

    <rect x="171" y="0" width="70" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="206" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Firebase</text>

    <rect x="249" y="0" width="80" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="289" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
  </g>

  <text x="470" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">VOXEL TELEMETRY 3D</text>
</svg>
