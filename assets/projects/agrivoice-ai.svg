<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #3FB950; }
      
      @keyframes waveBarMotion {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1.35); }
      }
      @keyframes voxelFloatAG {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      
      .wave-bar-1 { transform-origin: bottom; animation: waveBarMotion 1.4s ease-in-out infinite 0.1s; }
      .wave-bar-2 { transform-origin: bottom; animation: waveBarMotion 1.4s ease-in-out infinite 0.3s; }
      .wave-bar-3 { transform-origin: bottom; animation: waveBarMotion 1.4s ease-in-out infinite 0.5s; }
      .wave-bar-4 { transform-origin: bottom; animation: waveBarMotion 1.4s ease-in-out infinite 0.2s; }
      .voxel-floating { animation: voxelFloatAG 4.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="190" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">SPEECH AI // MULTILINGUAL</text>
  </g>

  <!-- Title & Sub -->
  <text x="24" y="76" class="proj-title">AgriVoice AI</text>
  <text x="24" y="98" class="proj-sub">Multilingual AI Voice Catalog System for Indian Agriculture</text>

  <!-- High Contrast Bullet Points -->
  <g transform="translate(24, 122)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="9" class="proj-body">• Multilingual vernacular speech-to-intent transcription</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="9" class="proj-body">• Autonomous entity extraction for crop attributes &amp; market price</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="9" class="proj-body">• Eliminates manual keyboard entry for rural farm accessibility</text>
    </g>
  </g>

  <!-- Right Side: 3D Minecraft Agricultural Crop Voxel Block & Voice Waves -->
  <g>
    <!-- Voxel Platform Pedestal -->
    <g transform="translate(470, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-125" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating 3D Minecraft Voxel Block -->
    <g class="voxel-floating">
      <!-- Main Agricultural Earth / Crop Voxel Block -->
      <g transform="translate(470, 130)">
        <!-- Top Face (Emerald Green Crop Soil Layer) -->
        <polygon points="0,-32 38,-14 0,4 -38,-14" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.2" />
        <polygon points="0,-22 22,-12 0,-2 -22,-12" fill="#2EA043" />
        <!-- Pixel seeds on top -->
        <circle cx="0" cy="-12" r="2.5" fill="#F0883E" />
        <circle cx="-14" cy="-14" r="2" fill="#FFFFFF" />
        <circle cx="14" cy="-10" r="2" fill="#FFFFFF" />

        <!-- Left Face (Earth / Obsidian Strata) -->
        <polygon points="-38,-14 0,4 0,42 -38,24" fill="#21262D" stroke="#D0D7DE" stroke-width="1.2" />
        <rect x="-28" y="4" width="14" height="12" fill="#161B22" opacity="0.6" transform="skewY(26)" />

        <!-- Right Face (Deep Soil / Mineral Strata) -->
        <polygon points="38,-14 0,4 0,42 38,24" fill="#30363D" stroke="#FFFFFF" stroke-width="1.2" />
        <rect x="14" y="-8" width="14" height="12" fill="#1C2128" opacity="0.6" transform="skewY(-26)" />
      </g>

      <!-- Floating Voice Waveform Voxel Bars -->
      <g transform="translate(470, 75)">
        <rect x="-24" y="0" width="6" height="22" fill="#3FB950" class="wave-bar-1" />
        <rect x="-12" y="0" width="6" height="32" fill="#F0883E" class="wave-bar-2" />
        <rect x="0" y="0" width="6" height="26" fill="#FFFFFF" class="wave-bar-3" />
        <rect x="12" y="0" width="6" height="34" fill="#3FB950" class="wave-bar-4" />
        <rect x="24" y="0" width="6" height="18" fill="#F0883E" class="wave-bar-1" />
      </g>

      <text x="470" y="60" class="proj-mono" fill="#3FB950" text-anchor="middle">SPEECH INGEST</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="32" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">SpeechAI</text>

    <rect x="73" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="105" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Python</text>

    <rect x="146" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="178" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">FastAPI</text>

    <rect x="219" y="0" width="70" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="254" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Whisper</text>
  </g>

  <text x="470" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">VOXEL ACOUSTIC 3D</text>
</svg>
