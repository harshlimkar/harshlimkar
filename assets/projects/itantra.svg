<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #3FB950; }
      
      @keyframes meshWave3D {
        0% { r: 8; opacity: 1; }
        100% { r: 52; opacity: 0; }
      }
      @keyframes voxelFloatIT {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      
      .radio-ring-1 { animation: meshWave3D 2.6s ease-out infinite; }
      .radio-ring-2 { animation: meshWave3D 2.6s ease-out infinite 0.9s; }
      .radio-ring-3 { animation: meshWave3D 2.6s ease-out infinite 1.8s; }
      .voxel-floating { animation: voxelFloatIT 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="190" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">OFFLINE MESH // DECENTRALIZED</text>
  </g>

  <!-- Title strictly "iTantra" -->
  <text x="24" y="76" class="proj-title">iTantra</text>
  <text x="24" y="98" class="proj-sub">Offline Voice &amp; Decentralized Mesh Relay System</text>

  <!-- High Contrast Bullet Points -->
  <g transform="translate(24, 122)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="9" class="proj-body">• Multi-hop mesh transport via BLE &amp; Wi-Fi Direct</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="9" class="proj-body">• Embedded offline speech STT with Vosk JNI binaries</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="9" class="proj-body">• Pre-shared AES-256 key secure device pairing without cloud</text>
    </g>
  </g>

  <!-- Right Side: 3D Minecraft Voxel Mesh Antenna Tower & Signal Waves -->
  <g>
    <!-- Voxel Platform Pedestal -->
    <g transform="translate(470, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-125" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating 3D Minecraft Voxel Tower -->
    <g class="voxel-floating">
      <!-- Lower Base Voxel Block -->
      <g transform="translate(470, 160)">
        <polygon points="0,-20 32,-8 0,4 -32,-8" fill="#30363D" stroke="#FFFFFF" stroke-width="1" />
        <polygon points="-32,-8 0,4 0,24 -32,12" fill="#21262D" stroke="#D0D7DE" stroke-width="1" />
        <polygon points="32,-8 0,4 0,24 32,12" fill="#161B22" stroke="#FFFFFF" stroke-width="1" />
      </g>

      <!-- Mid Voxel Antenna Core Block -->
      <g transform="translate(470, 128)">
        <polygon points="0,-16 22,-6 0,4 -22,-6" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.2" />
        <polygon points="-22,-6 0,4 0,22 -22,12" fill="#2EA043" stroke="#D0D7DE" stroke-width="1.2" />
        <polygon points="22,-6 0,4 0,22 22,12" fill="#1C6C2B" stroke="#FFFFFF" stroke-width="1.2" />
      </g>

      <!-- Top Voxel Transmitter Node -->
      <g transform="translate(470, 100)">
        <polygon points="0,-10 12,-4 0,2 -12,-4" fill="#F0883E" stroke="#FFFFFF" stroke-width="1" />
        <polygon points="-12,-4 0,2 0,14 -12,8" fill="#D97706" stroke="#484F58" stroke-width="1" />
        <polygon points="12,-4 0,2 0,14 12,8" fill="#B45309" stroke="#FFFFFF" stroke-width="1" />
      </g>

      <!-- Radiating Emerald Wireless Mesh Signal Rings -->
      <g transform="translate(470, 94)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#3FB950" stroke-width="1.8" class="radio-ring-1" />
        <circle cx="0" cy="0" r="10" fill="none" stroke="#3FB950" stroke-width="1.8" class="radio-ring-2" />
        <circle cx="0" cy="0" r="10" fill="none" stroke="#3FB950" stroke-width="1.8" class="radio-ring-3" />
        <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="70" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="35" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Android</text>

    <rect x="78" y="0" width="60" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="108" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Kotlin</text>

    <rect x="146" y="0" width="80" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="186" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Vosk STT</text>

    <rect x="234" y="0" width="75" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="271" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">BLE Mesh</text>
  </g>

  <text x="470" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">VOXEL MESH RELAY 3D</text>
</svg>
