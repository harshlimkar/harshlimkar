<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #3FB950; }
      
      @keyframes voxelFloatSPIC {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes ecgTravel {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseHeart {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      
      .voxel-floating { animation: voxelFloatSPIC 4.5s ease-in-out infinite; }
      .ecg-line { stroke-dasharray: 24 8; animation: ecgTravel 2s linear infinite; }
      .pulse-voxel { transform-origin: 470px 115px; animation: pulseHeart 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="190" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">AGENTIC AI // CLINICAL TRIAGE</text>
  </g>

  <!-- Title & Sub -->
  <text x="24" y="76" class="proj-title">SPIC</text>
  <text x="24" y="98" class="proj-sub">Agentic AI System for Trauma Emergency Decisions</text>

  <!-- High-Contrast Bullet Points -->
  <g transform="translate(24, 122)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="9" class="proj-body">• Autonomous multi-agent clinical reasoning systems</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="9" class="proj-body">• Fast, structured &amp; explainable triage under acute load</text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="9" class="proj-body">• Cross-agent consensus verification preventing omissions</text>
    </g>
  </g>

  <!-- Right Side: 3D Isometric Minecraft Voxel Block Stack (Triage System) -->
  <g>
    <!-- Voxel Platform Pedestal -->
    <g transform="translate(470, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-115" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating Minecraft Voxel Cluster -->
    <g class="voxel-floating">
      <!-- Main Emerald Triage Voxel Block (Center) -->
      <g transform="translate(470, 130)">
        <!-- Top Face (Emerald Green Grass Layer) -->
        <polygon points="0,-28 32,-12 0,4 -32,-12" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Pixel Grid on Top Face -->
        <polygon points="0,-18 16,-10 0,-2 -16,-10" fill="#2EA043" />
        
        <!-- Left Face (Dark Emerald) -->
        <polygon points="-32,-12 0,4 0,36 -32,20" fill="#2EA043" stroke="#D0D7DE" stroke-width="1.2" />
        <rect x="-24" y="2" width="12" height="12" fill="#1C6C2B" opacity="0.6" transform="skewY(26)" />

        <!-- Right Face (Deep Forest Shaded) -->
        <polygon points="32,-12 0,4 0,36 32,20" fill="#1C6C2B" stroke="#FFFFFF" stroke-width="1.2" />
        <rect x="12" y="-12" width="12" height="12" fill="#144620" opacity="0.6" transform="skewY(-26)" />
      </g>

      <!-- Satellite Voxel Block 1: Gold / Amber Clinical Vitality Cube (Top-Right) -->
      <g transform="translate(515, 88)">
        <polygon points="0,-14 16,-6 0,2 -16,-6" fill="#F0883E" stroke="#FFFFFF" stroke-width="1" />
        <polygon points="-16,-6 0,2 0,18 -16,10" fill="#D97706" stroke="#484F58" stroke-width="1" />
        <polygon points="16,-6 0,2 0,18 16,10" fill="#B45309" stroke="#FFFFFF" stroke-width="1" />
      </g>

      <!-- Satellite Voxel Block 2: Obsidian Reasoner Cube (Left) -->
      <g transform="translate(425, 96)">
        <polygon points="0,-14 16,-6 0,2 -16,-6" fill="#30363D" stroke="#FFFFFF" stroke-width="1" />
        <polygon points="-16,-6 0,2 0,18 -16,10" fill="#21262D" stroke="#484F58" stroke-width="1" />
        <polygon points="16,-6 0,2 0,18 16,10" fill="#161B22" stroke="#FFFFFF" stroke-width="1" />
      </g>

      <!-- Agent Coordination Wireflow Rays -->
      <line x1="470" y1="110" x2="515" y2="88" stroke="#F0883E" stroke-width="1.2" stroke-dasharray="3 2" />
      <line x1="470" y1="110" x2="425" y2="96" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3 2" />

      <!-- ECG Live Pulse Waveform Overlay -->
      <path d="M 410 162 L 440 162 L 448 144 L 456 178 L 464 154 L 472 166 L 478 162 L 530 162" fill="none" stroke="#3FB950" stroke-width="2" class="ecg-line" />
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="85" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="42" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Multi-Agent</text>

    <rect x="93" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="125" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">FastAPI</text>

    <rect x="166" y="0" width="75" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="203" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Clinical NLP</text>

    <rect x="249" y="0" width="65" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="281" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Python</text>
  </g>

  <text x="470" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">VOXEL TRIAGE SYSTEM 3D</text>
</svg>
