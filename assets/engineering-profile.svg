<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <style>
      .proj-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .proj-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; line-height: 1.5; }
      .proj-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #F0F6FC; }
      .proj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #D0D7DE; }
      .proj-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; fill: #3FB950; }
      .proj-desc { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8B949E; }

      @keyframes agentLaser {
        0%, 100% { stroke-dashoffset: 40; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes voxelFloatCORE {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes satelliteOrbit1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-4px, -6px); }
      }
      @keyframes satelliteOrbit2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(4px, 5px); }
      }

      .beam-flow { stroke-dasharray: 6 3; animation: agentLaser 2s linear infinite; }
      .voxel-floating { animation: voxelFloatCORE 4.5s ease-in-out infinite; }
      .sat-1 { animation: satelliteOrbit1 3s ease-in-out infinite; }
      .sat-2 { animation: satelliteOrbit2 3s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Minecraft Voxel Card Background -->
  <rect width="600" height="280" fill="#0D1117" rx="4" stroke="#484F58" stroke-width="1.5" />

  <!-- Blueprint Voxel Grid -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#484F58" stroke-width="1" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#484F58" stroke-width="1" />
    <line x1="390" y1="0" x2="390" y2="280" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="230" height="22" fill="#21262D" stroke="#484F58" stroke-width="1.2" rx="2" />
    <text x="12" y="15" class="proj-badge">SYSTEMS ARCHITECT // CORE PROFILE</text>
  </g>

  <!-- Title & Sub -->
  <text x="24" y="68" class="proj-title">Engineering Profile</text>
  <text x="24" y="88" class="proj-sub">AI Systems, Autonomous Agents &amp; Full-Stack Architecture</text>

  <!-- Spacious Bullets -->
  <g transform="translate(24, 106)">
    <!-- Bullet 1: AI Application Development -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#3FB950" />
      <text x="16" y="8" class="proj-body"><tspan font-weight="700" fill="#FFFFFF">AI Application Development</tspan></text>
      <text x="16" y="24" class="proj-desc">• Python, Machine Learning &amp; Data Structures</text>
    </g>

    <!-- Bullet 2: Flutter, React & Full-Stack -->
    <g transform="translate(0, 42)">
      <circle cx="4" cy="5" r="3" fill="#F0883E" />
      <text x="16" y="8" class="proj-body"><tspan font-weight="700" fill="#FFFFFF">Flutter, React &amp; Full-Stack Development</tspan></text>
      <text x="16" y="24" class="proj-desc">• Cross-platform interfaces, FastAPI backends &amp; distributed edge architecture</text>
    </g>

    <!-- Bullet 3: LLMs & AI Agents -->
    <g transform="translate(0, 84)">
      <circle cx="4" cy="5" r="3" fill="#FFFFFF" />
      <text x="16" y="8" class="proj-body"><tspan font-weight="700" fill="#FFFFFF">LLMs, AI Agents &amp; Automation</tspan></text>
      <text x="16" y="24" class="proj-desc">• Local SLM inference (Ollama), hybrid RAG pipelines &amp; zero-cloud privacy</text>
    </g>
  </g>

  <!-- Right Side: 3D Minecraft Voxel Neural Processor Core & Orbiting Nodes -->
  <g>
    <!-- Voxel Platform Pedestal -->
    <g transform="translate(495, 205)">
      <polygon points="0,-24 85,-4 0,16 -85,-4" fill="#161B22" stroke="#484F58" stroke-width="1.2" />
      <line x1="0" y1="-4" x2="0" y2="-125" stroke="#6E7681" stroke-width="1.2" stroke-dasharray="2 2" />
    </g>

    <!-- Floating 3D Voxel Processor Assembly -->
    <g class="voxel-floating">
      <!-- Base Silicon Socket Voxel Block -->
      <g transform="translate(495, 142)">
        <polygon points="0,-28 36,-12 0,4 -36,-12" fill="#21262D" stroke="#FFFFFF" stroke-width="1.2" />
        <polygon points="-36,-12 0,4 0,32 -36,16" fill="#161B22" stroke="#D0D7DE" stroke-width="1.2" />
        <polygon points="36,-12 0,4 0,32 36,16" fill="#30363D" stroke="#FFFFFF" stroke-width="1.2" />
      </g>

      <!-- Active Neural Core Voxel (Cyber Emerald) -->
      <g transform="translate(495, 106)">
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Pixel circuit pattern on top -->
        <polygon points="0,-12 12,-6 0,0 -12,-6" fill="#2EA043" />
        <polygon points="-26,-8 0,4 0,22 -26,10" fill="#2EA043" stroke="#D0D7DE" stroke-width="1.2" />
        <polygon points="26,-8 0,4 0,22 26,10" fill="#1C6C2B" stroke="#FFFFFF" stroke-width="1.2" />
      </g>

      <!-- Orbiting Satellite Node 1 (Amber) -->
      <g transform="translate(458, 92)" class="sat-1">
        <polygon points="0,-8 10,-3 0,2 -10,-3" fill="#F0883E" stroke="#FFFFFF" stroke-width="0.8" />
        <polygon points="-10,-3 0,2 0,10 -10,5" fill="#D97706" />
        <polygon points="10,-3 0,2 0,10 10,5" fill="#B45309" />
      </g>

      <!-- Orbiting Satellite Node 2 (White) -->
      <g transform="translate(532, 118)" class="sat-2">
        <polygon points="0,-8 10,-3 0,2 -10,-3" fill="#FFFFFF" stroke="#484F58" stroke-width="0.8" />
        <polygon points="-10,-3 0,2 0,10 -10,5" fill="#D0D7DE" />
        <polygon points="10,-3 0,2 0,10 10,5" fill="#8B949E" />
      </g>

      <!-- Upward Neural Synapse Stream -->
      <g transform="translate(495, 106)">
        <line x1="0" y1="-20" x2="0" y2="-55" stroke="#3FB950" stroke-width="2" class="beam-flow" />
        <circle cx="0" cy="-55" r="4" fill="#3FB950" />
        <text x="10" y="-52" class="proj-mono" fill="#3FB950">AI AGENTS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(24, 240)">
    <rect x="0" y="0" width="105" height="22" fill="#21262D" stroke="#484F58" stroke-width="1" rx="2" />
    <text x="52" y="15" class="proj-mono" fill="#FFFFFF" text-anchor="middle">Chennai, IN</text>

    <rect x="115" y="0" width="235" height="22" fill="#21262D" stroke="#3FB950" stroke-width="1.2" rx="2" />
    <circle cx="127" cy="11" r="3" fill="#3FB950" />
    <text x="238" y="15" class="proj-mono" fill="#3FB950" text-anchor="middle">harshlimkar23@gmail.com</text>
  </g>

  <text x="495" y="252" class="proj-mono" fill="#D0D7DE" text-anchor="middle">AI NEURAL PROCESSOR 3D</text>
</svg>
